# ClinicScribe - Google Cloud Build Pipeline
# Builds, tests, pushes to Google Artifact Registry, and deploys to Cloud Run with Vertex AI and AlloyDB

steps:
  # 1. Backend Unit Tests
  - name: 'python:3.11-slim'
    id: 'backend-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd backend
        pip install --no-cache-dir -r requirements.txt
        pytest

  # 2. Build Backend Docker Container (Tagged for Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest'
      - './backend'

  # 3. Push Backend Container to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend'

  # 4. Build Frontend Docker Container (Tagged for Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${COMMIT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest'
      - './frontend'

  # 5. Push Frontend Container to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend'

  # 6. Deploy Backend API to Cloud Run (With Vertex AI & AlloyDB configuration)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend-cloudrun'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'clinicscribe-api'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=ENVIRONMENT=production,DEBUG=false,USE_VERTEX_AI=true,GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},VERTEX_AI_LOCATION=${_REGION},ALLOYDB_ENABLED=true,ALLOYDB_PROJECT_ID=${PROJECT_ID},ALLOYDB_REGION=${_REGION},ALLOYDB_CLUSTER=clinicscribe-alloydb-cluster,ALLOYDB_INSTANCE=clinicscribe-primary-instance'
      - '--vpc-connector=projects/${PROJECT_ID}/locations/${_REGION}/connectors/clinicscribe-vpc-cx'
      - '--service-account=clinicscribe-app-sa@${PROJECT_ID}.iam.gserviceaccount.com'

  # 7. Deploy Frontend Web App to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend-cloudrun'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'clinicscribe-web'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_APP_ENV=production'

substitutions:
  _REGION: 'asia-south1'
  _REPO_NAME: 'clinicscribe-registry'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

