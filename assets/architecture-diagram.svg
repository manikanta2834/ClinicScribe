<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" width="100%" height="100%">
  <defs>
    <!-- Deep Medical Canvas Gradient -->
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C1A" />
      <stop offset="50%" stop-color="#042F2C" />
      <stop offset="100%" stop-color="#074842" />
    </linearGradient>

    <!-- Card 1 & 2 & 4 Gradient (Deep Teal Glass) -->
    <linearGradient id="card-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#095C54" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#032B27" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card 3 Gradient (Vertex AI Gold Glow) -->
    <linearGradient id="card-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A5B53" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#05332F" stop-opacity="0.98" />
    </linearGradient>

    <!-- Edge Highlight -->
    <linearGradient id="edge-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFE1E0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#48B7A0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B927F" stop-opacity="0.6" />
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .flow-pulse {
        stroke-dasharray: 8, 8;
        animation: dashMove 1.4s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -32; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1140" height="540" rx="20" fill="url(#arch-bg)" />

  <!-- Ambient Light Glow Behind Cards -->
  <circle cx="155" cy="250" r="130" fill="#48B7A0" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="430" cy="250" r="130" fill="#48B7A0" opacity="0.10" filter="url(#soft-glow)" />
  <circle cx="705" cy="250" r="140" fill="#FFE082" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="980" cy="250" r="130" fill="#0B927F" opacity="0.12" filter="url(#soft-glow)" />

  <!-- Header Section -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
    Enterprise Cloud Architecture &amp; Data Pipeline
  </text>
  <text x="50" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#48B7A0">
    Google Cloud Run (Next.js &amp; FastAPI) • Vertex AI (Gemini 1.5 Pro) • AlloyDB for PostgreSQL • asia-south1 (Mumbai)
  </text>

  <!-- ============================================================== -->
  <!-- CONNECTING DATA PIPELINES                                      -->
  <!-- ============================================================== -->
  <!-- Line 1: Audio -> Next.js -->
  <path class="flow-pulse" d="M 270 250 L 315 250" fill="none" stroke="#48B7A0" stroke-width="3.5" />
  <circle cx="292" cy="250" r="4.5" fill="#BFE1E0">
    <animate attributeName="cx" values="270;315" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Line 2: Next.js -> Vertex AI -->
  <path class="flow-pulse" d="M 545 250 L 590 250" fill="none" stroke="#48B7A0" stroke-width="3.5" />
  <circle cx="567" cy="250" r="4.5" fill="#FFE082">
    <animate attributeName="cx" values="545;590" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Line 3: Vertex AI -> AlloyDB -->
  <path class="flow-pulse" d="M 820 250 L 865 250" fill="none" stroke="#48B7A0" stroke-width="3.5" />
  <circle cx="842" cy="250" r="4.5" fill="#48B7A0">
    <animate attributeName="cx" values="820;865" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Feedback Loop: Doctor Sign-Off -> Workspace -->
  <path class="flow-pulse" d="M 705 385 L 705 435 L 430 435 L 430 385" fill="none" stroke="#BFE1E0" stroke-width="2.5" />
  <rect x="500" y="420" width="220" height="30" rx="15" fill="#021C1A" stroke="#BFE1E0" stroke-width="1.5" />
  <text x="610" y="439" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#BFE1E0">
    🩺 Doctor Review &amp; Sign-off Loop
  </text>

  <!-- ============================================================== -->
  <!-- CARD 1: Audio Ingestion (Explicit x="40")                      -->
  <!-- ============================================================== -->
  <rect x="40" y="115" width="230" height="270" rx="18" fill="url(#card-teal)" stroke="url(#edge-highlight)" stroke-width="1.5" filter="url(#card-shadow)" />
  <circle cx="155" cy="165" r="26" fill="#042F2C" stroke="#48B7A0" stroke-width="1.5" />
  <text x="155" y="173" text-anchor="middle" font-size="22">🎙️</text>
  <text x="155" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
    Consultation Audio
  </text>
  <text x="155" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#48B7A0" letter-spacing="1">
    INPUT INGESTION
  </text>
  <rect x="55" y="255" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="155" y="272" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    Tamil / Tanglish Dialogue
  </text>
  <rect x="55" y="289" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="155" y="306" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    Hindi / Hinglish Dialogue
  </text>
  <rect x="55" y="323" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="155" y="340" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    Indian English Outpatient
  </text>

  <!-- ============================================================== -->
  <!-- CARD 2: Next.js Frontend (Explicit x="315")                    -->
  <!-- ============================================================== -->
  <rect x="315" y="115" width="230" height="270" rx="18" fill="url(#card-teal)" stroke="url(#edge-highlight)" stroke-width="1.5" filter="url(#card-shadow)" />
  <circle cx="430" cy="165" r="26" fill="#042F2C" stroke="#48B7A0" stroke-width="1.5" />
  <text x="430" y="173" text-anchor="middle" font-size="22">⚡</text>
  <text x="430" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
    Next.js 14 Frontend
  </text>
  <text x="430" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#48B7A0" letter-spacing="1">
    GOOGLE CLOUD RUN
  </text>
  <rect x="330" y="255" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="430" y="272" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    Live Soundwave Meter
  </text>
  <rect x="330" y="289" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="430" y="306" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    Doctor Review Workspace
  </text>
  <rect x="330" y="323" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="430" y="340" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    Web Speech Recognition
  </text>

  <!-- ============================================================== -->
  <!-- CARD 3: Vertex AI Gemini (Explicit x="590")                    -->
  <!-- ============================================================== -->
  <rect x="590" y="115" width="230" height="270" rx="18" fill="url(#card-gold)" stroke="#FFE082" stroke-width="2" filter="url(#card-shadow)" />
  <circle cx="705" cy="165" r="26" fill="#042F2C" stroke="#FFE082" stroke-width="1.5" />
  <text x="705" y="173" text-anchor="middle" font-size="22">✨</text>
  <text x="705" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
    Vertex AI Engine
  </text>
  <text x="705" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFE082" letter-spacing="1">
    GEMINI 1.5 PRO
  </text>
  <rect x="605" y="255" width="200" height="26" rx="8" fill="#021C1A" stroke="#5D4C07" />
  <text x="705" y="272" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFE082">
    🛡️ Zero-Fabrication Gate
  </text>
  <rect x="605" y="289" width="200" height="26" rx="8" fill="#021C1A" stroke="#5D4C07" />
  <text x="705" y="306" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFE082">
    Structured SOAP Schema
  </text>
  <rect x="605" y="323" width="200" height="26" rx="8" fill="#021C1A" stroke="#5D4C07" />
  <text x="705" y="340" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFE082">
    Uncertainty &amp; Missing Info
  </text>

  <!-- ============================================================== -->
  <!-- CARD 4: AlloyDB & Exports (Explicit x="865")                   -->
  <!-- ============================================================== -->
  <rect x="865" y="115" width="230" height="270" rx="18" fill="url(#card-teal)" stroke="url(#edge-highlight)" stroke-width="1.5" filter="url(#card-shadow)" />
  <circle cx="980" cy="165" r="26" fill="#042F2C" stroke="#48B7A0" stroke-width="1.5" />
  <text x="980" y="173" text-anchor="middle" font-size="22">🗄️</text>
  <text x="980" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
    AlloyDB &amp; Reports
  </text>
  <text x="980" y="235" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#48B7A0" letter-spacing="1">
    STORAGE &amp; EXPORTS
  </text>
  <rect x="880" y="255" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="980" y="272" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    AlloyDB PostgreSQL (pgvector)
  </text>
  <rect x="880" y="289" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="980" y="306" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    ReportLab Prescription PDF
  </text>
  <rect x="880" y="323" width="200" height="26" rx="8" fill="#021C1A" stroke="#075D55" />
  <text x="980" y="340" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#BFE1E0">
    Tamil • Hindi Summaries
  </text>

  <!-- Bottom Regulatory Compliance Bar -->
  <rect x="40" y="480" width="1055" height="34" rx="10" fill="#021C1A" stroke="#48B7A0" stroke-width="1" />
  <text x="567" y="502" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#BFE1E0">
    🔒 DPDP Act 2023 &amp; DISHA Compliant • SHA-256 Consent Audit Log • Multi-Tenant Data Isolation • asia-south1 (Mumbai)
  </text>
</svg>
