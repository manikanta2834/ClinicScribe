<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <mask id="pulseCutout">
      <!-- White everywhere to keep circle -->
      <rect width="1000" height="1000" fill="#ffffff" />
      <!-- Black stroke to cut out pulse line -->
      <path d="M 293 500 L 370 500 L 446 331 L 554 669 L 630 500 L 707 500"
            fill="none"
            stroke="#000000"
            stroke-width="54"
            stroke-linecap="round"
            stroke-linejoin="round" />
    </mask>
  </defs>
  <circle cx="500" cy="500" r="460" fill="#075D55" mask="url(#pulseCutout)" />
</svg>